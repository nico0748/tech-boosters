<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig><include ignore_missing="yes">/etc/fonts/fonts.conf</include>
<match target="pattern"><test qual="any" name="family"><string>Hiragino Sans</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit></match>
<match target="pattern"><test qual="any" name="family"><string>UD新ゴ Pr6N M</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit></match>
<match target="pattern"><test qual="any" name="family"><string>Gibson</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
<match target="pattern"><test qual="any" name="family"><string>Codec Cold</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
<match target="pattern"><test qual="any" name="family"><string>Menlo</string></test><edit name="family" mode="assign" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
</fontconfig>
