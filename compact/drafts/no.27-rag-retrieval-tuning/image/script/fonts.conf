<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig><include ignore_missing="yes">/etc/fonts/fonts.conf</include>
<match target="pattern"><test qual="any" name="family"><string>Hiragino Sans</string></test><edit name="family" mode="assign" binding="strong"><string>IPAGothic</string></edit></match>
<match target="pattern"><test qual="any" name="family"><string>Helvetica Neue</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
<match target="pattern"><test qual="any" name="family"><string>Menlo</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit></match>
</fontconfig>
