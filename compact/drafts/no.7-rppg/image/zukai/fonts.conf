<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig><include ignore_missing="yes">/etc/fonts/fonts.conf</include>
<match target="pattern"><test qual="any" name="family"><string>Hiragino Mincho ProN</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK JP</string></edit></match><match target="pattern"><test qual="any" name="family"><string>Times New Roman</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match></fontconfig>
